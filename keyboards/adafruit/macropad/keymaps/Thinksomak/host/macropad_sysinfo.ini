; Settings for the macropad sysinfo agent (main.py / macropad-sysinfo.exe).
; Keep this file next to main.py or the exe. Text after ; is a comment.

[device]
; USB IDs of the macropad, from keyboards/adafruit/macropad/keyboard.json
vid = 0x239A
pid = 0x0108
; QMK's Raw HID interface (same for every QMK keyboard)
usage_page = 0xFF60
usage = 0x61

[agent]
; Seconds between updates, 0.25 to 25
interval = 1.0
; GPU load: off, or nvidia (needs nvidia-smi, which comes with the NVIDIA driver)
gpu = off
; Network adapter to measure, as Windows names it, e.g. Wi-Fi or Ethernet.
; Empty = all adapters added together.
nic =
; How much goes into the log file: DEBUG, INFO or WARNING
log_level = INFO

[power]
; Host Power: shut down or restart this PC from the macropad (SYSTEM layer,
; POWER key). Off unless this says true; while off, the macropad shows
; "Disabled in agent config".
; WARNING: when the countdown ends, Windows closes open apps without asking
; (shutdown /t implies /f), so unsaved work is lost.
allow_power_commands = false
; Seconds from the key press to the shutdown or restart, 5 to 99. The
; macropad counts them down; its top-right key cancels.
power_delay = 15
